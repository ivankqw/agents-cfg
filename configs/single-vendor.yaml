name: single-vendor
summary: One provider end to end, when the other has no quota left.
when: A provider is capped or unreachable and work cannot wait.
roles:
  orchestrator: { model: codex-sol, effort: xhigh }
  implementer:  { model: codex-sol, effort: low, parallel: true }
  reviewer:     { model: codex-sol, effort: high, cross_vendor: false }
notes: >-
  The reviewer now shares weights with the author, so the usual independence is
  gone. Compensate: dispatch it with no shared context, forbid it from reading
  the author's reasoning, and require executed evidence for every finding.
  Say in the PR that the review was single-vendor.
