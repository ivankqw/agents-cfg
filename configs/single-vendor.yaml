name: single-vendor
summary: Codex owns every role because it cannot call Claude through a plugin.
when: Codex owns the main session, or the Claude harness is unavailable.
harness: codex
roles:
  orchestrator: { model: codex-sol, effort: xhigh }
  implementer:  { model: codex-sol, effort: low, parallel: true }
  reviewer:     { model: gpt-5.5, effort: high, cross_vendor: false }
notes: >-
  Use this config for a Codex-led stretch. The reviewer stays with the same vendor
  but uses a different model from the author. Dispatch it with no shared context,
  forbid it from reading the author's reasoning, and require executed evidence for
  every finding. A claude -p subprocess can provide an external review, but it is
  not the reviewer from deep. Say in the PR that the configured review was single-vendor.
