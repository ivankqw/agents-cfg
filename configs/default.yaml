name: default
summary: Strong planner, cheap parallel builders, cross-vendor reviewer.
when: Ordinary day-to-day work.
roles:
  orchestrator: { model: opus-5, effort: medium }
  implementer:  { model: sonnet-5, effort: default, parallel: true }
  reviewer:     { model: codex-sol, effort: high, cross_vendor: true }
notes: >-
  The reviewer sits with a different vendor from the author, which is where its
  independence comes from. If that vendor is unavailable, switch config rather
  than quietly reviewing your own work.
